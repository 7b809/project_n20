<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hentai Manga Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-book-half"></i>
            Manga Dashboard
        </a>

        <div class="d-flex align-items-center gap-2">

            <span class="badge bg-primary px-3 py-2">
                Auto Scraper
            </span>

            <span class="badge bg-success px-3 py-2">
                Pagination Enabled
            </span>

        </div>

    </div>
</nav>

<div class="container-fluid py-4">

    <div class="row">

        <div class="col-lg-3 mb-4">

            <div class="sidebar-box">

                <div class="mb-4">

                    <h2 class="fw-bold mb-2">
                        Hentai Dashboard
                    </h2>

                    <p class="text-secondary small mb-0">
                        Browse manga and open reader mode
                    </p>

                </div>

                <form id="loadForm">

                    <div class="mb-3">

                        <label class="small mb-2">
                            Direct Chapter URL
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="url"
                            placeholder="Paste chapter URL"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="small mb-2">
                            Start Chapter
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="chapter"
                            value="1"
                        >

                    </div>

                    <div class="mb-3">

                        <label class="small mb-2">
                            Max Images
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="limit"
                            value="50"
                        >

                    </div>

                    <button class="btn btn-primary w-100">

                        <i class="bi bi-lightning-charge-fill"></i>

                        Open Reader

                    </button>

                </form>

                <div class="stats-box mt-4">

                    <div class="small text-secondary mb-3">
                        Features
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Manga Pagination
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Auto Homepage Scraping
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Separate Reader Page
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Lazy Loading Images
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Infinite Chapter Navigation
                    </div>

                </div>

            </div>

        </div>

        <div class="col-lg-9">

            <div class="reader-wrapper">

                <div class="reader-topbar">

                    <div>

                        <h3 class="fw-bold mb-1">
                            Latest Manga
                        </h3>

                        <div class="text-secondary small">
                            Auto scraped homepage listings
                        </div>

                    </div>

                    <button
                        id="refreshBtn"
                        class="btn btn-dark btn-sm"
                    >

                        <i class="bi bi-arrow-clockwise"></i>
                        Refresh

                    </button>

                </div>

                <div
                    id="mangaGrid"
                    class="row g-4"
                ></div>

                <div
                    id="paginationContainer"
                    class="d-flex flex-wrap gap-2 justify-content-center mt-5"
                ></div>

            </div>

        </div>

    </div>

</div>

<script src="/static/js/app.js"></script>

<script>
const form = document.getElementById("loadForm");

form.addEventListener("submit",(e)=>{

    e.preventDefault();

    const url =
        document.getElementById("url")
        .value
        .trim();

    if(!url){
        return;
    }

    window.location.href =
        `/viewer?url=${encodeURIComponent(url)}`;
});
</script>

</body>
</html>
