<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Hentai Manga Reader
    </title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>



<!-- =========================
     TOP NAVBAR
========================= -->

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand fw-bold"
            href="#"
        >

            <i class="bi bi-book-half"></i>

            Manga Reader

        </a>


        <div class="d-flex align-items-center gap-3">

            <span class="badge bg-primary px-3 py-2">

                Lazy Loading Enabled

            </span>

        </div>

    </div>

</nav>



<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container-fluid py-4">

    <div class="row">


        <!-- =========================
             SIDEBAR
        ========================= -->

        <div class="col-lg-3 mb-4">

            <div class="sidebar-box">


                <!-- TITLE -->

                <div class="mb-4">

                    <h2 class="fw-bold mb-2">

                        Hentai Dashboard

                    </h2>

                    <p class="text-secondary small mb-0">

                        Dynamic chapter image generator
                        with smart lazy loading

                    </p>

                </div>



                <!-- FORM -->

                <form id="loadForm">

                    <div class="mb-3">

                        <label class="small mb-2">

                            Chapter URL

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="url"
                            placeholder="Paste chapter URL"
                            required
                        >

                    </div>



                    <div class="mb-3">

                        <label class="small mb-2">

                            Start Chapter

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="chapter"
                            value="1"
                        >

                    </div>



                    <div class="mb-3">

                        <label class="small mb-2">

                            Max Images Per Chapter

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="limit"
                            value="50"
                        >

                    </div>



                    <button
                        class="btn btn-primary w-100"
                    >

                        <i class="bi bi-lightning-charge-fill"></i>

                        Load Chapters

                    </button>

                </form>



                <!-- FEATURES -->

                <div class="stats-box mt-4">

                    <div class="small text-secondary mb-3">

                        Reader Features

                    </div>


                    <div class="feature-item">

                        <i class="bi bi-check-circle-fill"></i>

                        Lazy Image Loading

                    </div>

                    <div class="feature-item">

                        <i class="bi bi-check-circle-fill"></i>

                        Infinite Chapter Scroll

                    </div>

                    <div class="feature-item">

                        <i class="bi bi-check-circle-fill"></i>

                        Responsive Manga Reader

                    </div>

                    <div class="feature-item">

                        <i class="bi bi-check-circle-fill"></i>

                        Smart Memory Optimization

                    </div>

                    <div class="feature-item">

                        <i class="bi bi-check-circle-fill"></i>

                        Auto Image Detection

                    </div>

                </div>



                <!-- CHAPTER BUTTONS -->

                <div class="mt-4">

                    <div class="small text-secondary mb-3">

                        Chapters

                    </div>

                    <div
                        id="chapterButtons"
                        class="d-flex flex-wrap gap-2"
                    ></div>

                </div>

            </div>

        </div>



        <!-- =========================
             READER SECTION
        ========================= -->

        <div class="col-lg-9">

            <div class="reader-wrapper">


                <!-- READER TOPBAR -->

                <div class="reader-topbar">

                    <div>

                        <h3 class="fw-bold mb-1">

                            Reader Mode

                        </h3>

                        <div class="text-secondary small">

                            Optimized vertical manga reading

                        </div>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            class="btn btn-dark btn-sm"
                        >

                            <i class="bi bi-phone"></i>

                            Mobile Ready

                        </button>

                        <button
                            class="btn btn-dark btn-sm"
                        >

                            <i class="bi bi-lightning-fill"></i>

                            Fast Render

                        </button>

                    </div>

                </div>



                <!-- VIEWER -->

                <div
                    id="viewerContainer"
                    class="reader-container"
                ></div>

            </div>

        </div>

    </div>

</div>



<!-- =========================
     FLOATING SCROLL TOP
========================= -->

<button
    id="scrollTopBtn"
    class="scroll-top-btn"
>

    <i class="bi bi-arrow-up"></i>

</button>



<!-- =========================
     FLOATING CHAPTER NAV
========================= -->

<div class="floating-chapter-nav">

    <button
        id="prevChapterBtn"
        class="floating-nav-btn"
    >

        <i class="bi bi-arrow-left"></i>

        Prev

    </button>


    <button
        id="nextChapterBtn"
        class="floating-nav-btn"
    >

        Next

        <i class="bi bi-arrow-right"></i>

    </button>

</div>



<!-- =========================
     JS
========================= -->

<script src="/static/js/app.js"></script>



<!-- =========================
     SCROLL TOP BUTTON
========================= -->

<script>

const scrollBtn =
    document.getElementById(
        "scrollTopBtn"
    );

window.addEventListener("scroll",()=>{

    if(window.scrollY > 600){

        scrollBtn.style.opacity = "1";
    }
    else{

        scrollBtn.style.opacity = "0";
    }
});

scrollBtn.onclick = ()=>{

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};

</script>

</body>
</html>
