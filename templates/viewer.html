<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader Viewer</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">

        <a class="navbar-brand fw-bold" href="/">
            <i class="bi bi-arrow-left"></i>
            Back To Dashboard
        </a>

        <div class="d-flex align-items-center gap-2">

            <span class="badge bg-primary px-3 py-2">
                Reader Mode
            </span>

            <span class="badge bg-success px-3 py-2">
                Infinite Scroll
            </span>

        </div>

    </div>
</nav>

<div class="container-fluid py-4">

    <div class="row">

        <div class="col-lg-3 mb-4">

            <div class="sidebar-box">

                <div class="mb-4">

                    <h2 class="fw-bold mb-2">
                        Reader Controls
                    </h2>

                    <p class="text-secondary small mb-0">
                        Infinite manga chapter reader
                    </p>

                </div>

                <div class="mb-3">

                    <label class="small mb-2">
                        Chapter URL
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="url"
                        value="{{ url }}"
                    >

                </div>

                <div class="mb-3">

                    <label class="small mb-2">
                        Start Chapter
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="chapter"
                        value="1"
                    >

                </div>

                <div class="mb-3">

                    <label class="small mb-2">
                        Max Images
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="limit"
                        value="50"
                    >

                </div>

                <button
                    id="reloadBtn"
                    class="btn btn-primary w-100"
                >

                    <i class="bi bi-arrow-repeat"></i>
                    Reload Reader

                </button>

                <div class="stats-box mt-4">

                    <div class="small text-secondary mb-3">
                        Reader Features
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Lazy Image Loading
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Infinite Chapters
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Keyboard Navigation
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Smart Memory Optimization
                    </div>

                    <div class="feature-item">
                        <i class="bi bi-check-circle-fill"></i>
                        Floating Chapter Navigation
                    </div>

                </div>

                <div class="mt-4">

                    <div class="small text-secondary mb-3">
                        Chapters
                    </div>

                    <div
                        id="chapterButtons"
                        class="d-flex flex-wrap gap-2"
                    ></div>

                </div>

            </div>

        </div>

        <div class="col-lg-9">

            <div class="reader-wrapper">

                <div class="reader-topbar">

                    <div>

                        <h3 class="fw-bold mb-1">
                            Reader Mode
                        </h3>

                        <div class="text-secondary small">
                            Optimized vertical manga reading
                        </div>

                    </div>

                    <div class="d-flex gap-2">

                        <button class="btn btn-dark btn-sm">

                            <i class="bi bi-phone"></i>
                            Mobile Ready

                        </button>

                        <button class="btn btn-dark btn-sm">

                            <i class="bi bi-lightning-fill"></i>
                            Fast Render

                        </button>

                    </div>

                </div>

                <div
                    id="viewerContainer"
                    class="reader-container"
                >

                    <div class="text-center py-5 text-secondary">

                        <div class="spinner-border text-light"></div>

                        <div class="mt-3">
                            Loading Reader...
                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<button
    id="scrollTopBtn"
    class="scroll-top-btn"
>

    <i class="bi bi-arrow-up"></i>

</button>

<div class="floating-chapter-nav">

    <button
        id="prevChapterBtn"
        class="floating-nav-btn"
    >

        <i class="bi bi-arrow-left"></i>
        Prev

    </button>

    <button
        id="nextChapterBtn"
        class="floating-nav-btn"
    >

        Next
        <i class="bi bi-arrow-right"></i>

    </button>

</div>

<script src="/static/js/app.js"></script>

<script>
const scrollBtn =
    document.getElementById(
        "scrollTopBtn"
    );

window.addEventListener("scroll",()=>{

    scrollBtn.style.opacity =
        window.scrollY > 600 ? "1" : "0";
});

scrollBtn.onclick = ()=>{

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
};
</script>

</body>
</html>
